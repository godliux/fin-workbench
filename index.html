<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>金融早盘工作台</title>
<style>
  :root{
    --navy:#15315B; --navy2:#1d3f73; --gold:#C9A24A; --bg:#EEF1F6; --card:#FFFFFF;
    --line:#E2E7EF; --txt:#1c2530; --sub:#6b7787; --up:#D4380D; --down:#237804;
    --warn:#C0392B; --ok:#2E7D32; --shadow:0 1px 3px rgba(20,40,80,.08),0 4px 14px rgba(20,40,80,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--txt); font-size:16px; line-height:1.5;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .wrap{max-width:1080px;margin:0 auto;padding:14px 14px 90px;}
  header{
    background:linear-gradient(135deg,var(--navy),var(--navy2)); color:#fff;
    border-radius:14px; padding:16px 18px; box-shadow:var(--shadow);
    display:flex; flex-wrap:wrap; align-items:center; gap:10px; justify-content:space-between;
  }
  header h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.5px;}
  header .sub{font-size:12px;opacity:.8;margin-top:3px;}
  .head-btns{display:flex;flex-wrap:wrap;gap:8px;}
  .btn{
    border:1px solid var(--line); background:#fff; color:var(--navy);
    border-radius:10px; padding:10px 12px; font-size:14px; cursor:pointer;
    min-height:44px; display:inline-flex; align-items:center; gap:6px; font-weight:600;
  }
  .btn:hover{background:#f4f7fb;}
  .btn.primary{background:var(--navy);color:#fff;border-color:var(--navy);}
  .btn.primary:hover{background:var(--navy2);}
  .btn.gold{background:var(--gold);color:#fff;border-color:var(--gold);}
  .btn.danger{color:var(--warn);border-color:#f0c9c2;}
  .btn svg{width:16px;height:16px;}
  .upd{font-size:12px;opacity:.85;width:100%;margin-top:2px;}

  /* 今日要处理 */
  .alert-zone{margin-top:14px;}
  .zone-title{font-size:14px;font-weight:700;color:var(--navy);margin:0 0 8px 2px;display:flex;align-items:center;gap:6px;}
  .alert-card{
    background:#fff;border:1px solid var(--line);border-left:4px solid var(--warn);
    border-radius:12px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow);
    display:flex;align-items:center;gap:10px;justify-content:space-between;
  }
  .alert-card .a-txt{font-size:14px;}
  .alert-card .a-tag{font-size:11px;background:var(--warn);color:#fff;border-radius:6px;padding:2px 7px;margin-right:6px;}
  .alert-card .a-handle{min-height:40px;padding:8px 14px;background:var(--navy);color:#fff;border:none;border-radius:9px;font-size:13px;cursor:pointer;font-weight:600;}

  /* 导航 tabs */
  nav.tabs{display:flex;gap:8px;margin:16px 0 6px;flex-wrap:wrap;}
  nav.tabs button{
    flex:1;min-width:120px;min-height:46px;border:1px solid var(--line);background:#fff;color:var(--navy);
    border-radius:11px;font-size:14px;font-weight:700;cursor:pointer;padding:8px;
  }
  nav.tabs button.active{background:var(--navy);color:#fff;border-color:var(--navy);}
  section.panel{display:none;margin-top:10px;}
  section.panel.active{display:block;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);}
  .card h3{margin:0 0 10px;font-size:15px;color:var(--navy);display:flex;align-items:center;gap:8px;justify-content:space-between;}
  .card h3 .meta{font-size:12px;color:var(--sub);font-weight:500;}

  /* 筛选条 */
  .filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
  .filters button{
    border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:20px;
    padding:7px 13px;font-size:13px;cursor:pointer;min-height:38px;
  }
  .filters button.on{background:var(--navy);color:#fff;border-color:var(--navy);}
  .filters .spacer{flex:1;}
  .filters select{border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:13px;min-height:38px;background:#fff;color:var(--txt);}

  /* 简报条目 */
  .item{border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:9px;background:#fbfcfe;}
  .item .i-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
  .chip{font-size:11px;border-radius:6px;padding:2px 8px;font-weight:700;}
  .chip.m-us{background:#e8eefc;color:#1d3f73;}
  .chip.m-eu{background:#eafaf0;color:#237804;}
  .chip.m-co{background:#fdf3e3;color:#b5791a;}
  .chip.m-cn{background:#fdeaea;color:#c0392b;}
  .chip.t-night{background:#eef1f6;color:#55657a;}
  .chip.t-pred{background:#f3ecfb;color:#6b3fa0;}
  .chip.dir-bull{background:#fdeaea;color:var(--up);}
  .chip.dir-bear{background:#eafaf0;color:var(--down);}
  .item .i-date{font-size:12px;color:var(--sub);margin-left:auto;}
  .item .i-title{font-size:14px;font-weight:700;margin:2px 0 4px;}
  .item .i-content{font-size:13.5px;color:#33404f;}
  .item .i-foot{font-size:12px;color:var(--sub);margin-top:6px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .conf-bar{height:6px;width:70px;background:#e6eaf0;border-radius:4px;overflow:hidden;display:inline-block;vertical-align:middle;}
  .conf-bar i{display:block;height:100%;background:var(--gold);}
  .chip.m-out{background:#eaf0fb;color:#264a86;}
  .chip.t-session{background:#e6f4f1;color:#0b6b5b;}
  .chip.t-pred{background:#f3ecfb;color:#6b3fa0;}
  .chip.p-morning{background:#e8eefc;color:#1d3f73;}
  .chip.p-midday{background:#fff3e0;color:#b5791a;}
  .chip.p-close{background:#fdeaea;color:#c0392b;}
  .day-group{margin:14px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .day-head{background:#f5f7fb;padding:10px 14px;font-weight:700;color:#1d3f73;display:flex;justify-content:space-between;align-items:center;font-size:14px;}
  .day-head .pers{font-size:12px;font-weight:600;color:#55657a;}
  .row-act{margin-left:auto;display:flex;gap:6px;}
  .mini{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 9px;font-size:12px;cursor:pointer;min-height:34px;color:var(--sub);}
  .mini.del{color:var(--warn);border-color:#f0c9c2;}

  /* 添加表单 */
  .addform{display:none;border:1px dashed var(--line);border-radius:11px;padding:12px;margin-bottom:10px;background:#f8fafc;}
  .addform.show{display:block;}
  .addform .frow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
  .addform input,.addform select,.addform textarea{
    border:1px solid var(--line);border-radius:9px;padding:10px;font-size:16px;font-family:inherit;background:#fff;color:var(--txt);
  }
  .addform input[type=text],.addform textarea,.addform select{flex:1;min-width:140px;}
  .addform textarea{min-height:60px;resize:vertical;width:100%;}
  .addform input.num{width:120px;}

  /* 个股卡片 */
  .stock-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;}
  .stock{border:1px solid var(--line);border-radius:13px;padding:14px;background:#fff;box-shadow:var(--shadow);}
  .stock .s-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .stock .s-name{font-size:16px;font-weight:700;color:var(--navy);}
  .stock .s-code{font-size:12px;color:var(--sub);}
  .stock .s-price{font-size:22px;font-weight:800;}
  .stock .s-chg{font-size:13px;font-weight:700;}
  .badge{font-size:11px;background:var(--warn);color:#fff;border-radius:6px;padding:3px 8px;font-weight:700;}
  .news{margin-top:10px;border-top:1px solid var(--line);padding-top:8px;}
  .news .n-item{font-size:13px;padding:6px 0;border-bottom:1px dashed #eef1f6;display:flex;gap:8px;}
  .news .n-item .n-date{color:var(--sub);font-size:12px;white-space:nowrap;}
  .news .n-item .n-type{font-size:11px;border-radius:5px;padding:1px 6px;height:fit-content;}
  .nt-news{background:#e8eefc;color:#1d3f73;}
  .nt-ann{background:#fdf3e3;color:#b5791a;}
  .nt-sen{background:#f3ecfb;color:#6b3fa0;}
  .s-note{font-size:13px;color:#33404f;margin-top:8px;background:#f8fafc;border-radius:9px;padding:8px 10px;}
  .s-adv{font-size:13px;font-weight:700;margin-top:8px;padding:8px 10px;border-radius:9px;}
  .s-adv.buy{background:#eafaf0;color:var(--down);}
  .s-adv.hold{background:#eef1f6;color:var(--navy);}
  .s-adv.sell{background:#fdeaea;color:var(--up);}
  .s-adv.warn{background:#fdf3e3;color:#b5791a;}

  /* 持仓 */
  .hold .h-row{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:10px;}
  .stat{flex:1;min-width:130px;background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:10px 12px;}
  .stat .k{font-size:12px;color:var(--sub);}
  .stat .v{font-size:20px;font-weight:800;margin-top:2px;}
  .bar{height:12px;background:#e6eaf0;border-radius:8px;overflow:hidden;margin:8px 0;}
  .bar i{display:block;height:100%;}
  .sugg{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:12px;margin-top:8px;}
  .sugg .lab{font-size:12px;color:var(--sub);}
  .sugg .txt{font-size:14px;font-weight:700;margin:3px 0 8px;}
  .sugg .risk{font-size:13px;color:var(--warn);}

  .empty{text-align:center;color:var(--sub);padding:24px;font-size:14px;}
  .banner{background:#fff8e6;border:1px solid #f0dca0;color:#8a6d1b;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:10px;}

  /* 移动端底部 tab */
  @media(max-width:768px){
    .wrap{padding:12px 12px 86px;}
    nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);
      margin:0;padding:8px 10px;z-index:50;box-shadow:0 -2px 12px rgba(20,40,80,.08);}
    nav.tabs button{min-width:0;font-size:13px;padding:10px 4px;}
    header{flex-direction:column;align-items:flex-start;}
    .head-btns{width:100%;}
    .btn{flex:1;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>金融早盘工作台</h1>
      <div class="sub">夜盘行情 · 大V预测 · 个股追踪 · 持仓管理 · 离线可用</div>
      <div class="upd" id="updTime">最后更新：—</div>
    </div>
    <div class="head-btns">
      <button class="btn" onclick="exportJSON()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>导出JSON</button>
      <button class="btn" onclick="importJSON()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21V9m0 0l-4 4m4-4l4 4M5 3h14"/></svg>导入恢复</button>
      <button class="btn danger" onclick="clearAll()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V4h6v3m-7 0v13h8V7"/></svg>清空示例</button>
      <button class="btn gold" id="refreshBtn" onclick="refreshQuotes()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><path d="M21 12a9 9 0 11-3-6.7M21 4v5h-5"/></svg>刷新行情</button>
    </div>
  </header>

  <!-- 今日要处理 -->
  <div class="alert-zone">
    <div class="zone-title"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="var(--warn)" stroke-width="2"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17h.01"/></svg>今日要处理</div>
    <div id="alertList"></div>
  </div>

  <!-- 导航 -->
  <nav class="tabs">
    <button class="active" data-tab="brief" onclick="switchTab('brief',this)">每日盘面简报</button>
    <button data-tab="stocks" onclick="switchTab('stocks',this)">个股追踪</button>
    <button data-tab="hold" onclick="switchTab('hold',this)">持仓管理</button>
  </nav>

  <!-- 简报 -->
  <section class="panel active" id="brief">
    <div class="card">
      <h3>每日盘面分析 <span class="meta">早盘 · 午盘 · 结盘（手动选时段，默认最新一天，可按日期查历史）</span></h3>
      <div id="briefBanner"></div>
      <div class="filters" style="margin-bottom:8px">
        <button class="on" data-period="全部" onclick="setPeriod(this)">全部时段</button>
        <button data-period="早盘" onclick="setPeriod(this)">早盘</button>
        <button data-period="午盘" onclick="setPeriod(this)">午盘</button>
        <button data-period="结盘" onclick="setPeriod(this)">结盘</button>
        <span class="spacer"></span>
        <select id="dateSel" onchange="onDateChange()" title="按日期查历史（默认最新一天）">
          <option value="">最新一天</option>
        </select>
      </div>
      <div class="filters">
        <button class="on" data-cat="all" onclick="setCat(this)">全部市场</button>
        <button data-cat="外围股市" onclick="setCat(this)">外围股市</button>
        <button data-cat="商品" onclick="setCat(this)">商品</button>
        <button data-cat="A股" onclick="setCat(this)">A股</button>
        <span class="spacer"></span>
        <button class="on" data-type="all" onclick="setType(this)">全部</button>
        <button data-type="night" onclick="setType(this)">隔夜</button>
        <button data-type="predict" onclick="setType(this)">预测</button>
        <button data-type="session" onclick="setType(this)">盘面</button>
        <select id="sortSel" onchange="renderBrief()">
          <option value="desc">日期 ↓ 新→旧</option>
          <option value="asc">日期 ↑ 旧→新</option>
        </select>
      </div>
      <button class="btn primary" onclick="toggleBriefForm()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>添加一条简报</button>
      <div class="addform" id="briefForm">
        <div class="frow">
          <input type="text" id="bTitle" placeholder="标题，如：美股三大指数收涨">
          <select id="bCat">
            <option value="外围股市">外围股市</option><option value="商品">商品</option>
            <option value="A股">A股</option>
          </select>
          <select id="bType">
            <option value="night">隔夜行情</option><option value="predict">大V预测</option>
            <option value="session">盘面汇总</option>
          </select>
          <select id="bPeriod">
            <option value="早盘">早盘</option><option value="午盘">午盘</option><option value="结盘">结盘</option>
          </select>
        </div>
        <div class="frow">
          <input type="text" id="bDate" placeholder="日期 YYYY-MM-DD">
          <input type="text" id="bSource" placeholder="来源/平台（预测必填）">
          <input type="number" id="bConf" class="num" placeholder="置信度%" min="0" max="100">
        </div>
        <div class="frow">
          <select id="bDir">
            <option value="">方向（预测用）</option>
            <option value="bull">看多/偏多</option><option value="bear">看空/偏空</option>
          </select>
        </div>
        <textarea id="bContent" placeholder="内容，如：道指+0.8%、纳指+1.2%；科技股领涨。预测：大V认为早盘高开震荡。"></textarea>
        <div class="frow" style="margin-top:8px;justify-content:flex-end;">
          <button class="mini" onclick="toggleBriefForm()">取消</button>
          <button class="btn primary" onclick="saveBrief()">保存</button>
        </div>
      </div>
      <div id="briefList"></div>
    </div>
  </section>

  <!-- 个股 -->
  <section class="panel" id="stocks">
    <div class="card">
      <h3>重点个股追踪 <span class="meta">三七互娱 · 巨人网络 · 世纪华通</span></h3>
      <div style="margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <button class="btn primary" onclick="refreshQuotes()">获取实时行情</button>
        <span style="font-size:12px;color:var(--sub)">数据源：东方财富公开接口（实时价）· 红涨绿跌</span>
      </div>
      <div class="stock-grid" id="stockGrid"></div>
    </div>
  </section>

  <!-- 持仓 -->
  <section class="panel" id="hold">
    <div class="card hold">
      <h3>持仓管理 <span class="meta">创业板ETF东财</span></h3>
      <div id="holdBody"></div>
    </div>
  </section>
</div>

<input type="file" id="fileInput" accept="application/json" style="display:none" onchange="doImport(event)">

<script>
/* ============ 存储 ============ */
const PX="wb_fin_";
function getK(k,def){try{const v=localStorage.getItem(PX+k);return v?JSON.parse(v):def;}catch(e){return def;}}
function setK(k,v){localStorage.setItem(PX+k,JSON.stringify(v));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}

/* ============ 初始化示例数据 ============ */
function seed(){
  if(getK("seeded",false)) return;
  const t=today();
  const y=new Date(Date.now()-864e5); const yd=y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0");
  setK("digest",[
    {id:uid(),date:yd,period:"早盘",cat:"外围股市",type:"night",title:"外围股市收高（昨日未读）",content:"美股道指+0.8%、纳指+1.2%、标普+0.9%；欧股Stoxx50+0.5%、DAX+0.6%、CAC+0.4%，同步温和上行。",source:"隔夜复盘",read:false},
    {id:uid(),date:t,period:"早盘",cat:"外围股市",type:"night",title:"外围股市小幅收高",content:"道指+0.6%、纳指+1.0%、标普+0.7%；英伟达带动半导体；欧股同步温和上行。",source:"隔夜复盘",read:false},
    {id:uid(),date:t,period:"早盘",cat:"商品",type:"night",title:"大宗商品分化",content:"WTI原油+1.5%（79.2美元）、布伦特+1.3%；COMEX黄金-0.3%（2345美元）；LME铜+0.8%。",source:"隔夜复盘",read:false},
    {id:uid(),date:t,period:"早盘",cat:"A股",type:"predict",title:"大V「稳赢老周」：早盘高开震荡",content:"认为外围偏暖+政策预期，早盘大概率高开，但量能不足，午后回落概率大。",source:"雪球",direction:"bull",confidence:70,read:false},
    {id:uid(),date:t,period:"早盘",cat:"A股",type:"predict",title:"大V「量化小张」：偏空谨慎",content:"技术面创业板仍处下降通道，反弹减仓为主，不建议追高。",source:"雪球",direction:"bear",confidence:55,read:false}
  ]);
  setK("stocks",[
    {id:uid(),name:"三七互娱",code:"002555",price:14.20,chg:1.8,alert:false,alertText:"",
      news:[{date:t,type:"news",text:"新游《斗罗大陆：猎魂世界》上线首周流水超预期。"}],
      note:"基本面：出海+AI降本逻辑仍在；技术面站上20日线。",adv:"hold",advText:"持有观察，关注20日线支撑"},
    {id:uid(),name:"巨人网络",code:"002558",price:12.80,chg:-0.6,alert:false,alertText:"",
      news:[{date:t,type:"ann",text:"发布半年度业绩预告，净利润同比+15%。"}],
      note:"业绩稳健，估值合理；技术面横盘整理。",adv:"hold",advText:"持有，等待放量突破"},
    {id:uid(),name:"世纪华通",code:"002602",price:6.50,chg:4.2,alert:true,alertText:"盘中异动拉升超4%，量能放大，疑似题材催化",
      news:[{date:t,type:"sen",text:"舆情：市场传言公司获某头部车企AI合作意向，未证实。"}],
      note:"异动需核实，避免追高接盘。",adv:"warn",advText:"异动观察，核实消息后再决策"}
  ]);

function renderBrief(){
  const d=getK("digest",[]);
  const sort=document.getElementById("sortSel").value;
  const order={"早盘":0,"午盘":1,"结盘":2};
  // 基础筛选：市场 + 类型（类型用子串匹配，兼容 "session盘面汇总" 等变体）
  let list=d.filter(function(x){
    if(curCat!=="all"&&x.cat!==curCat) return false;
    if(curType!=="all"&&(x.type||"").indexOf(curType)<0) return false;
    return true;
  });
  if(curPeriod!=="全部") list=list.filter(x=>(x.period||"早盘")===curPeriod);
  // 未选日期 → 默认最新一天；选了日期 → 查该日
  let targetDate=curDate;
  if(!targetDate){
    const ds=Object.keys(list.reduce(function(a,x){if(x.date)a[x.date]=1;return a;},{}));
    if(ds.length) targetDate=ds.sort(function(a,b){return sort==="asc"?a.localeCompare(b):b.localeCompare(a);})[0];
  }
  const show=list.filter(function(x){return !targetDate||(x.date||"")===targetDate;});
  const byDate={};
  show.forEach(function(x){const k=x.date||"未知";(byDate[k]=byDate[k]||[]).push(x);});
  const dates=Object.keys(byDate).sort(function(a,b){return sort==="desc"?b.localeCompare(a):a.localeCompare(b);});
  const el=document.getElementById("briefList");
  if(dates.length===0){el.innerHTML='<div class="empty">暂无符合条件的简报，点上方"添加一条简报"。</div>';}
  else{
    el.innerHTML=dates.map(function(dt){
      const items=byDate[dt].slice().sort(function(a,b){return (order[a.period]??9)-(order[b.period]??9);});
      const pers=[...new Set(items.map(function(x){return x.period||"早盘";}))].sort(function(a,b){return (order[a]??9)-(order[b]??9);}).join(" / ");
      const inner=items.map(function(x){
        const catChip=`<span class="chip m-${x.cat==='外围股市'?'out':x.cat==='商品'?'co':'cn'}">${x.cat}</span>`;
        const tt=x.type||"";
        const isPred=tt.indexOf("predict")>=0, isSess=tt.indexOf("session")>=0;
        const typeLabel=isSess?"盘面汇总":isPred?"大V预测":"隔夜行情";
        const typeChip=`<span class="chip ${isPred?'t-pred':isSess?'t-session':'t-night'}">${typeLabel}</span>`;
        const perKey=x.period==='早盘'?'morning':x.period==='午盘'?'midday':x.period==='结盘'?'close':'morning';
        const perChip=`<span class="chip p-${perKey}">${x.period||'早盘'}</span>`;
        let dirChip="",conf="";
        if(isPred){
          if(x.direction)dirChip=`<span class="chip dir-${x.direction}">${x.direction==='bull'?'看多':'看空'}</span>`;
          if(x.confidence)conf=`<span>置信度 ${x.confidence}% <span class="conf-bar"><i style="width:${x.confidence}%"></i></span></span>`;
        }
        return `<div class="item" style="margin:8px 0">
          <div class="i-head">${catChip}${typeChip}${perChip}${dirChip}<span class="i-date">${x.read?'':' · 未读'}</span></div>
          <div class="i-title">${x.title}</div>
          <div class="i-content">${x.content}</div>
          <div class="i-foot"><span>来源：${x.source}</span>${conf}
            <span class="row-act"><button class="mini" onclick="markRead('${x.id}')">${x.read?'标未读':'标已读'}</button><button class="mini del" onclick="delBrief('${x.id}')">删除</button></span>
          </div></div>`;
      }).join("");
      const tag=curDate?'历史查阅':'最新';
      return `<div class="day-group"><div class="day-head"><span>${dt} · ${pers}</span><span class="pers">${tag}</span></div>${inner}</div>`;
    }).join("");
  }
  buildDateOptions();
  const b=document.getElementById("briefBanner");
  if(d.length>=30) b.innerHTML=`<div class="banner">⚠️ 简报已累计 ${d.length} 条，建议点击右上角"导出JSON"备份，避免本地数据丢失。</div>`;
  else b.innerHTML="";
}

/* ============ 盘面分析自动载入（早盘/午盘/结盘 三文件） ============ */
async function fetchMarket(){
  // 候选文件：早盘 morning-data.json、午盘 midday-data.json、结盘 close-data.json
  // 同源（GitHub Pages/本地服务）优先；?morning= 参数或 jsDelivr CDN 兜底（CORS 放行）
  const files=["morning-data.json","midday-data.json","close-data.json"];
  const remote=new URLSearchParams(location.search).get("morning");
  const jsdelivr="https://cdn.jsdelivr.net/gh/godliux/fin-workbench@main/";
  const cur=getK("digest",[]);
  const seen=new Set(cur.map(x=>(x.date||"")+"|"+(x.period||"")+"|"+(x.title||"")));
  let total=0, okUrl=null;
  for(const f of files){
    const candidates=[f, jsdelivr+f];
    if(remote)candidates.unshift(remote);
    for(const u of candidates){
      try{
        const res=await fetch(u,{cache:"no-store"});
        if(!res.ok)continue;
        const arr=await res.json();
        if(!Array.isArray(arr)||!arr.length)continue;
        let a=0;
        arr.forEach(x=>{
          const key=(x.date||"")+"|"+(x.period||"")+"|"+(x.title||"");
          if(!seen.has(key)){cur.push(Object.assign({id:uid(),read:false,source:x.source||"盘面自动"},x));seen.add(key);a++;}
        });
        if(a>0){total+=a;okUrl=u;}
        break;
      }catch(e){continue;}
    }
  }
  if(total>0)setK("digest",cur);
  const b=document.getElementById("briefBanner");
  if(b){
    if(okUrl){
      const label=okUrl.includes("jsdelivr")?"CDN远端载入":"同源自动载入";
      b.innerHTML='<div style="padding:8px 12px;border-radius:8px;margin:8px 0;font-size:13px;background:#e8f5e9;color:#1b5e20">盘面分析已'+label+'（早盘/午盘/结盘），新增 '+total+' 条</div>';
    }else{
      b.innerHTML='<div style="padding:8px 12px;border-radius:8px;margin:8px 0;font-size:13px;background:#fff3e0;color:#b26a00">盘面分析未自动载入（同源/远端均无数据文件）。可点顶部「导入恢复」手动上传，或地址栏加 ?morning=远端JSON地址 指定。</div>';
    }
  }
  return total;
}

/* ============ 实时行情刷新（腾讯 qt.gtimg.cn 公开接口，已验证 CORS 放行） ============ */
function gtCode(code){
  if(!code)return "";
  return (/^[69]/.test(code)?"sh":"sz")+code;
}
async function refreshQuotes(){
  const stocks=getK("stocks",[]);
  const h=getK("holding",null);
  const codes=[];
  stocks.forEach(s=>{if(s.code)codes.push(gtCode(s.code));});
  if(h&&h.code)codes.push(gtCode(h.code));
  if(!codes.length)return;
  const url="https://qt.gtimg.cn/q="+codes.join(",");
  const btn=document.getElementById("refreshBtn");
  if(btn){btn.disabled=true;btn.innerHTML='刷新中…';}
  try{
    const res=await fetch(url,{cache:"no-store"});
    if(!res.ok)throw new Error("HTTP"+res.status);
    const txt=await res.text();
    const re=/v_(\w+)="([^"]*)"/g; let m, n=0;
    while((m=re.exec(txt))){
      const code=m[1].toUpperCase();           // 如 SZ159205 / SZ002555
      const f=m[2].split("~");
      const price=parseFloat(f[3]);             // 当前价（实际值）
      const chgPct=parseFloat(f[32]);           // 涨跌幅%
      if(!(price>0))continue;
      if(h&&h.code&&code.indexOf(h.code)>=0){
        h.currentPrice=price; h.chg=chgPct;
        h.updTime=new Date().toLocaleString("zh-CN");
        setK("holding",h); n++;
      }
      const s=stocks.find(x=>x.code&&code.indexOf(x.code)>=0);
      if(s){s.price=price;s.chg=chgPct;n++;}
    }
    setK("stocks",stocks);
    document.getElementById("updTime").textContent="行情刷新："+new Date().toLocaleString("zh-CN")+(n?`（已更新 ${n} 项）`:"（无变化）");
    renderStocks();renderHold();renderAlerts();
  }catch(e){
    document.getElementById("updTime").textContent="行情刷新失败：接口跨域或网络受限，可点个股卡「更新行情」手动填";
  }finally{
    if(btn){btn.disabled=false;btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><path d="M21 12a9 9 0 11-3-6.7M21 4v5h-5"/></svg>刷新行情';}
  }
}

  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.remove("active"));
  if(btn)btn.classList.add("active");
  if(name==="brief")renderBrief();
  if(name==="stocks")renderStocks();
  if(name==="hold")renderHold();
}
function renderAll(){
  document.getElementById("updTime").textContent="最后更新："+new Date().toLocaleString("zh-CN");
  renderAlerts();renderBrief();renderStocks();renderHold();
}
seed();renderAll();
// 数据迁移：持仓代码曾误用 159971（实为富国创业板ETF）→ 纠正为 159205（东财创业板ETF）；
// 成本由占位值 1.617 纠正为用户实际成本 1.783
(function migrate(){
  const h=getK("holding",null); if(!h)return;
  let changed=false;
  if(h.code==="159971"){h.code="159205";changed=true;}
  if(h.buyPrice===1.617){h.buyPrice=1.783;changed=true;}
  if(changed){
    h.trend="（标的已更正 159205 创业板ETF东财；成本已更新为1.783）实时数据接入中，趋势以刷新后为准。";
    h.suggest="成本1.783，当前价以刷新为准。未破位前持有观察，重回1.783上方解套再加仓；若跌破1.64（-8%）且放量，考虑减仓控风险。";
    h.risk="ETF跟踪创业板整体，系统性回撤风险；仓位建议不超总权益30%。";
    setK("holding",h);
  }
})();

fetchMarket().then(()=>{renderBrief();renderAlerts();});
refreshQuotes(); // 打开即拉取实时行情（个股 + 持仓 159205）
